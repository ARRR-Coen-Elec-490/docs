name: "Hardware Printable Creation"

on:
    push:
        branches: [ "main" ]
        paths:
            - "hardware-documentation/**/*.kicad_sch"
            - "hardware-documentation/**/*.kicad_pcb"
            - "hardware-documentation/**/*.kicad_pro"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    render-pcb-schematics:
        name: Compile KiCAD to PDF
        runs-on: ubuntu-latest
        container:
          image: ghcr.io/inti-cmnb/kicad10_auto_full:latest
        steps:
          # STEP 1: Pull the latest code, including any Git LSF Assets
          - name: Checkout Code Base
            uses: actions/checkout@v6
            with:
              lfs: true

          # STEP 2: Run KiCAD CLI to generate printables for your working files
          - name: Export Vector Schematics
            env:
              HOME: /tmp
            run: |
              mkdir -p hardware-documentation/schematics
              find hardware-documentation -name '*.kicad_pro' | while read -r pro; do
                dir=$(dirname "$pro")
                base=$(basename "$pro" .kicad_pro)
                sch="$dir/$base.kicad_sch"
                pcb="$dir/$base.kicad_pcb"

                echo "Found project: $pro"
                if [ -f "$sch" ]; then
                  kicad-cli sch export pdf "$sch" -o "$GITHUB_WORKSPACE/hardware-documentation/schematics/${base}_schematic.pdf"
                fi
                if [ -f "$pcb" ]; then
                  front_pdf="/tmp/${base}_front.pdf"
                  back_pdf="/tmp/${base}_back.pdf"
                  out_pdf="$GITHUB_WORKSPACE/hardware-documentation/schematics/${base}_pcb.pdf"

                  # Page 1: Front layers (Copper + Silkscreen + Fabrication + Board Outline)
                  kicad-cli pcb export pdf "$pcb" \
                    -o "$front_pdf" \
                    --layers "F.Cu,F.SilkS,F.Fab,Edge.Cuts" \
                    --scale 2.5

                  # Page 2: Back layers (Mirrored horizontally for natural inspection)
                  kicad-cli pcb export pdf "$pcb" \
                    -o "$back_pdf" \
                    --layers "B.Cu,B.SilkS,B.Fab,Edge.Cuts" \
                    --mirror \
                    --scale 2.5

                  # Merge Page 1 and Page 2 into the final PDF
                  if command -v pdfunite >/dev/null 2>&1; then
                    pdfunite "$front_pdf" "$back_pdf" "$out_pdf"
                  else
                    gs -dBATCH -dNOPAUSE -q -sDEVICE=pdfwrite -sOutputFile="$out_pdf" "$front_pdf" "$back_pdf"
                  fi
                fi
              done

          # STEP 3: Upload the generated printables to the repository
          - name: Create Pull Request for the Printables
            uses: peter-evans/create-pull-request@v7
            with:
              commit-message: "docs/hardware-documentation: auto-generate human-readable schematics"
              branch: docs/auto-schematics
              delete-branch: true
              title: "docs: auto-generate KiCad PDF schematics"
              body: |
                Automated PDF export of updated KiCad schematics and PCBs from `main`.
