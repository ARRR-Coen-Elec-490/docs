name: "Hardware Printable Creation"

on:
    push:
        branches: [ "main" ]
        paths:
            - "hardware-documentation/**/*.kicad_sch"
            - "hardware-documentation/**/*.kicad_pcb"
            - "hardware-documentation/**/*.kicad_pro"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    render-pcb-schematics:
        name: Compile KiCAD to PDF
        runs-on: ubuntu-latest
        container:
          image: ghcr.io/inti-cmnb/kicad8_auto_full:latest
        steps:
          # STEP 1: Pull the latest code, including any Git LSF Assets
          - name: Checkout Code Base
            uses: actions/checkout@v6
            with:
              lfs: true

          # STEP 2: Run KiBOT to generate printables for your working files
          - name: Export Vector Schematics
            run: |
              mkdir -p hardware-documentation/schematics
              cat << 'EOF' > /tmp/kibot_sch.yaml
              kibot:
                version: 1
              outputs:
                - name: 'print_sch'
                  comment: "Prints schematics to PDF"
                  type: pdf_sch
              EOF

              cat << 'EOF' > /tmp/kibot_pcb.yaml
              kibot:
                version: 1
              outputs:
                - name: 'print_pcb'
                  comment: "Prints PCB to PDF"
                  type: pdf_pcb
                  layers: all
              EOF

              find hardware-documentation -name '*.kicad_pro' | while read -r pro; do
                dir=$(dirname "$pro")
                base=$(basename "$pro" .kicad_pro)
                sch="$dir/$base.kicad_sch"
                pcb="$dir/$base.kicad_pcb"

                if [ -f "$sch" ]; then
                  kibot -c /tmp/kibot_sch.yaml -e "$sch" -d "$GITHUB_WORKSPACE/hardware-documentation/schematics"
                fi
                if [ -f "$pcb" ]; then
                  kibot -c /tmp/kibot_pcb.yaml -b "$pcb" -e "$sch" -d "$GITHUB_WORKSPACE/hardware-documentation/schematics"
                fi
              done

          # STEP 3: Upload the generated printables to the repository
          - name: Commit Printables to Repository
            run: |
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

              # Stage the commits
              git add hardware-documentation/schematics/

              # [skip ci] to prevent an infinite loop
              git diff-index --quiet HEAD || git commit -m "docs/hardware-documentation: auto-generate human-readable schematics [skip ci]"
              git push
